# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Repository Identity ===

[meta]
purpose = "To make explicit the boundaries, responsibilities, and expectations of this repository relative to others."

[repo]
name = "spec-ep"
org  = "structural-explainability"
class = "spec"
kind = "specification"
status = "active"
since = "2025"
summary = "Defines graph evolution over accountable entities without embedding explanation."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "specification"

# === Dependency Declarations ===

[depends]
required = [
  { repo = "spec-se", kind = "semantic", version = "v1" },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "README.md",
  "SPEC.md",
  "IDENTIFIERS.md",
  "CONFORMANCE.md",
  "data/spec/requirements.json",
  "data/spec/conformance-checks.json",
  "data/spec/scope-exclusions.json",
]

# === Scope ===

[scope]
includes = [
  "graph, state, delta, evolution constructs",
  "structural change recording",
  "history reconstruction constraints",
]
excludes = [
  "relationship semantics",
  "explanation or justification",
  "truth, validation, or enforcement",
  "optimization or decision logic",
]

# === Validation ===

[validation]
entrypoint = "uv run se-validate"
export_check_entrypoint = "uv run se-ref-export --check"
reference_entrypoint = "uv run se-ref-validate"
strict_entrypoint = "uv run se-validate --strict"
tag_entrypoint = "uv run python -m se_manifest_schema validate --strict --require-tag"

# === Behavior / governance ===

[naming]
pattern = "spec-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "spec"

[traceability]
identifier_map = "structural-explainability/spec-ep/IDENTIFIERS.md"
